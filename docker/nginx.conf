server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端发布版本文件，浏览器据此判断前端是否已发布到最新版本，必须每次回源，不能被浏览器或网关缓存
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}