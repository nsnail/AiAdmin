<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#1b1446"/><stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <linearGradient id="t" x1="0" x2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="g1" cx=".15" cy=".2" r=".6"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".9" cy=".9" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#g1)"/>
  <rect width="1280" height="360" rx="24" fill="url(#g2)"/>
  <g fill="none" stroke="#22d3ee" stroke-opacity=".35">
    <circle cx="1090" cy="180" r="120"><animate attributeName="r" values="110;135;110" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="180" r="80" stroke="#7c5cff" stroke-opacity=".6"/>
    <circle cx="1090" cy="180" r="40" stroke="#34d399" stroke-opacity=".8"/>
  </g>
  <text x="1090" y="198" font-size="54" font-weight="800" fill="#fff" text-anchor="middle">⚡</text>
  <text x="80" y="150" font-size="88" font-weight="900" fill="url(#t)" letter-spacing="2">AiAdmin</text>
  <text x="84" y="206" font-size="30" font-weight="600" fill="#e8ecff">.NET 11 × Vue 3 · 新一代全栈权限管理框架</text>
  <text x="84" y="250" font-size="20" fill="#9fb0d9">一套协议打通所有列表 · 三层权限守住每个角落 · 零中断滚动发布</text>
  <g font-size="16" font-weight="700" fill="#fff">
    <rect x="84" y="282" width="120" height="36" rx="18" fill="#7c5cff" fill-opacity=".85"/><text x="144" y="306" text-anchor="middle">.NET 11</text>
    <rect x="216" y="282" width="120" height="36" rx="18" fill="#22d3ee" fill-opacity=".85"/><text x="276" y="306" text-anchor="middle" fill="#04202b">Vue 3.5</text>
    <rect x="348" y="282" width="120" height="36" rx="18" fill="#34d399" fill-opacity=".85"/><text x="408" y="306" text-anchor="middle" fill="#04261a">Redis</text>
    <rect x="480" y="282" width="150" height="36" rx="18" fill="#f472b6" fill-opacity=".85"/><text x="555" y="306" text-anchor="middle">4 种数据库</text>
  </g>
</svg>