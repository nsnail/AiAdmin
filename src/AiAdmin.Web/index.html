<!doctype html>
<html>
    <head>
        <title>Art Design Pro</title>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta content="Art Design Pro - A modern admin dashboard template built with Vue 3, TypeScript, and Element Plus." name="description" />
        <link href="src/assets/images/favicon.ico" rel="shortcut icon" type="image/x-icon" />

        <style>
            /* 防止页面刷新时白屏的初始样式 */
            html {
                background-color: #fafbfc;
            }

            html.dark {
                background-color: #070707;
            }
        </style>

        <script>
            // 初始化 html class 主题属性
            ;(function () {
                try {
                    if (typeof Storage === 'undefined' || !window.localStorage) {
                        return
                    }

                    const themeType = localStorage.getItem('sys-theme')
                    if (themeType === 'dark') {
                        document.documentElement.classList.add('dark')
                    }
                } catch (e) {
                    console.warn('Failed to apply initial theme:', e)
                }
            })()
        </script>
    </head>

    <body>
        <div id="app"></div>
        <script src="/src/main.ts" type="module"></script>
    </body>
</html>
